; line-height: 1.5\">\n<div><strong>WhatsApp<\u002Fstrong><br>11 2671-0936<\u002Fdiv>\n<div><strong>Instagram<\u002Fstrong><br>[TU USUARIO]<\u002Fdiv>\n<div><strong>Horario de atención<\u002Fstrong><br>[TUS HORARIOS]<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex: 1 1 280px; min-width: 0; display: flex; flex-direction: column; gap: 10px; font-size: 16px; line-height: 1.5\">\n<div><strong>Formas de pago<\u002Fstrong><br>[TRANSFERENCIA / EFECTIVO / OTROS]<\u002Fdiv>\n<div><strong>Entregas<\u002Fstrong><br>[RETIRO EN PERSONA / ENVÍOS]<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#B5532B&quot;,&quot;options&quot;:[&quot;#B5532B&quot;,&quot;#5A6A40&quot;,&quot;#7C3A6B&quot;]},&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1500}}\">\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    this.state = { cat: 'Todos' };\n  }\n  renderVals() {\n    const accent = this.props.accent ?? '#B5532B';\n    const phone = '5491126710936';\n    const wa = (text) => 'https://wa.me/' + phone + '?text=' + encodeURIComponent(text);\n    const cats = ['Todos', 'Sets', 'Bolsos'];\n    const all = [\n      { name: 'Tote rosa de ecuaciones con cosmetiquera', cat: 'Sets', detail: 'Tote grande con base y asas a rayas blanco y negro, forro negro y cosmetiquera con cierre a juego.', img: '/_blob/c3f97a954eb05ccead27035966f1015d', alt: 'Tote rosa con estampa de ecuaciones y cosmetiquera a juego' },\n      { name: 'Bolso vertical con bandolera naranja', cat: 'Bolsos', detail: 'Bolsillo frontal con cierre, dos asas y bandolera regulable. Estampa de flores, mariposas y girasoles.', img: '/_blob/ae643065343fe93496b6208bbab4eadf', alt: 'Bolso vertical estampado con asas y bandolera naranja' },\n      { name: 'Tote cómic espacial con cosmetiquera', cat: 'Sets', detail: 'Tote de tiras cómicas con base y asas a rayas azules y rojas. Incluye cosmetiquera con cierre y tira para colgar.', img: '/_blob/e406303b3a045289442bda52881638be', alt: 'Tote de tiras cómicas con cosmetiquera a juego' },\n      { name: 'Tote floral cuadrillé con cosmetiquera', cat: 'Sets', detail: 'Tote de flores y cuadrillé en rosa y beige, con asas a rayas y cosmetiquera con cierre rosa.', img: '/_blob/26d8fca9ec97970430536e52d4aa909d', alt: 'Tote floral y cuadrillé rosa con cosmetiquera' }\n    ];\n    const withWa = all.map((p) => Object.assign({}, p, { wa: wa('Hola Tía Coco! Me interesa: ' + p.name) }));\n    const items = withWa.filter((p) => this.state.cat === 'Todos' || p.cat === this.state.cat);\n    const chipBase = 'font-size: 15px; font-weight: 500; padding: 10px 18px; min-height: 44px; border-radius: 999px; cursor: pointer; ';\n    const chips = cats.map((c) => {\n      const active = this.state.cat === c;\n      const count = c === 'Todos' ? withWa.length : withWa.filter((p) => p.cat === c).length;\n      return {\n        label: c,\n        count: count,\n        active: active,\n        style: chipBase + (active ? 'background: #3A2A1F; color: #FBF3E4; border: 2px solid #3A2A1F' : 'background: transparent; color: #3A2A1F; border: 2px solid #C9A981'),\n        pick: () => this.setState({ cat: c })\n      };\n    });\n    return {\n      accent: accent,\n      waLink: wa('Hola Tía Coco! Quiero consultar por sus productos'),\n      chips: chips,\n      items: items,\n      summary: items.length === 1 ? 'Mostrando 1 producto' : 'Mostrando ' + items.length + ' productos'\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
